name: episode-archive-eligibility-diagnostic

on:
  push:
    branches:
      - diagnostic/episode-archive-eligibility
    paths:
      - scripts/episode_archive_eligibility_eval.py
      - tests/test_episode_archive_eligibility.py
      - docs/episode-archive-eligibility-diagnostic.md
      - .github/workflows/episode-archive-eligibility.yml

permissions:
  contents: read

env:
  PRODUCTION_BASE: e3672c473723159232ab494a108eeca7d1903842
  PINNED_STATE_SHA: 906d216b54d76e3cb57c540cf59fd57004f29bf3

jobs:
  copied-state-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: 906d216b54d76e3cb57c540cf59fd57004f29bf3
          path: source
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: state/organism.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact head and diagnostic-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C source rev-parse HEAD)" = "$PINNED_STATE_SHA"
          python - <<'PY'
          import os
          import subprocess

          allowed = {
              "scripts/episode_archive_eligibility_eval.py",
              "tests/test_episode_archive_eligibility.py",
              "docs/episode-archive-eligibility-diagnostic.md",
              ".github/workflows/episode-archive-eligibility.yml",
          }
          changed = set(
              subprocess.check_output(
                  [
                      "git",
                      "-C",
                      "candidate",
                      "diff",
                      "--name-only",
                      f"{os.environ['PRODUCTION_BASE']}...HEAD",
                  ],
                  text=True,
              ).splitlines()
          )
          if changed != allowed:
              raise SystemExit(
                  "unexpected diagnostic scope: "
                  + ", ".join(sorted(changed ^ allowed))
              )
          PY

      - name: Run focused eligibility tests
        working-directory: candidate
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest tests.test_episode_archive_eligibility -v

      - name: Run copied-state archive eligibility replay
        shell: bash
        env:
          PYTHONPATH: candidate/src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          mkdir -p artifacts
          sha256sum source/state/organism.json > artifacts/source-state.sha256
          python candidate/scripts/episode_archive_eligibility_eval.py             --state source/state/organism.json             --src candidate/src             --hot-suffix 1024             --remove-count 1000             --steps 5             --output-dir artifacts             --output artifacts/archive-eligibility-report.json             2>&1 | tee artifacts/archive-eligibility.log

      - name: Verify pinned source remains byte-identical
        shell: bash
        run: |
          sha256sum -c artifacts/source-state.sha256

      - name: Package reviewed diagnostic source
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          git -C candidate rev-parse HEAD > artifacts/candidate-sha.txt
          git -C candidate archive --format=tar.gz HEAD             scripts/episode_archive_eligibility_eval.py             tests/test_episode_archive_eligibility.py             docs/episode-archive-eligibility-diagnostic.md             .github/workflows/episode-archive-eligibility.yml             > artifacts/reviewed-source.tar.gz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-archive-eligibility-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
