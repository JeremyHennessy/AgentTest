name: autonomous-growth-cycle
run-name: heartbeat ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Stable transport ticket from the heartbeat controller"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agenttest-autonomous-growth-v2
  queue: max
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    env:
      # Bounded rollout ended in a preserved null; ordinary planning resumes.
      CURRENT_WORLD_INVESTIGATION: 'false'
      HEARTBEAT_REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Require verified dispatched main source
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$WORKFLOW_SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          guard_path="$(mktemp "$RUNNER_TEMP/verified-growth-source-XXXXXX.py")"
          git show "$GITHUB_SHA:scripts/verified_growth_source.py" > "$guard_path"
          python -I -B "$guard_path" verify-ci --source-sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
          echo "VERIFIED_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "GROWTH_SOURCE_GUARD=$guard_path" >> "$GITHUB_ENV"
          transport_path="$(mktemp "$RUNNER_TEMP/heartbeat-transport-XXXXXX.py")"
          git show "$GITHUB_SHA:scripts/heartbeat_transport.py" > "$transport_path"
          echo "GROWTH_TRANSPORT=$transport_path" >> "$GITHUB_ENV"

      - name: Fetch durable state before choosing source
        shell: bash
        run: |
          git config user.name "agenttest-growth"
          git config user.email "agenttest-growth@users.noreply.github.com"
          git fetch origin autonomous/growth:refs/remotes/origin/autonomous/growth
          git checkout -B autonomous/growth origin/autonomous/growth
          echo "HEARTBEAT_REMOTE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          result="$(python -I -B "$GROWTH_TRANSPORT" inspect --root "$GITHUB_WORKSPACE" --request-id "$HEARTBEAT_REQUEST_ID")"
          disposition="$(python -c 'import json,sys; r=json.load(sys.stdin); q=r["request_status"]; p=r["status"] == "pending"; assert q != "abandoned", "abandoned ticket"; assert not p or q in ("pending", "completed"), "different heartbeat pending"; print("completed" if q == "completed" else "pending" if p else "new")' <<< "$result")"
          echo "HEARTBEAT_PRECHECK=$disposition" >> "$GITHUB_ENV"
          if [ "$disposition" = "new" ]; then
            git merge --no-edit "$VERIFIED_SOURCE_SHA"
          fi

      - name: Verify exact source before claim
        if: env.HEARTBEAT_PRECHECK != 'completed'
        run: python -I -B "$GROWTH_SOURCE_GUARD" verify-source --source-sha "$VERIFIED_SOURCE_SHA" --require-clean

      - name: Claim heartbeat remotely before computation
        id: heartbeat_claim
        shell: bash
        run: |
          if [ "$HEARTBEAT_PRECHECK" = "completed" ]; then
            echo "status=already_completed" >> "$GITHUB_OUTPUT"
            echo "This ticket already has a verified durable receipt; Core will not run."
            exit 0
          fi
          mode=ordinary
          if [ "$CURRENT_WORLD_INVESTIGATION" = "true" ]; then
            mode=current-world-investigation
          fi
          result="$(python -I -B "$GROWTH_TRANSPORT" claim --root "$GITHUB_WORKSPACE" --request-id "$HEARTBEAT_REQUEST_ID" --source-sha "$VERIFIED_SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --mode "$mode")"
          status="$(python -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<< "$result")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "already_completed" ]; then
            exit 0
          fi
          if [ "$status" = "created" ]; then
            python -I -B "$GROWTH_SOURCE_GUARD" verify-source --source-sha "$VERIFIED_SOURCE_SHA"
            git add state/heartbeat_operation.json state/organism.json
            git commit -m "Claim autonomous heartbeat request" -m "Heartbeat-Request: $HEARTBEAT_REQUEST_ID"
            python -I -B "$GROWTH_SOURCE_GUARD" verify-source --source-sha "$VERIFIED_SOURCE_SHA"
            python -I -B "$GROWTH_TRANSPORT" publish --root "$GITHUB_WORKSPACE" --candidate "$(git rev-parse HEAD)" --expected-parent "$HEARTBEAT_REMOTE_BASE"
          fi
          git fetch origin autonomous/growth:refs/remotes/origin/autonomous/growth
          claim_commit="$(git rev-parse HEAD)"
          test "$claim_commit" = "$(git rev-parse refs/remotes/origin/autonomous/growth)"
          echo "HEARTBEAT_CLAIM_COMMIT=$claim_commit" >> "$GITHUB_ENV"

      - name: Observe and run one autonomous cycle
        if: steps.heartbeat_claim.outputs.status != 'already_completed'
        shell: bash
        run: |
          python -I -B "$GROWTH_SOURCE_GUARD" verify-source --source-sha "$VERIFIED_SOURCE_SHA" --require-clean
          python -I -B "$GROWTH_TRANSPORT" cycle --root "$GITHUB_WORKSPACE" --request-id "$HEARTBEAT_REQUEST_ID" --source-sha "$VERIFIED_SOURCE_SHA" --claim-commit "$HEARTBEAT_CLAIM_COMMIT"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m agenttest propose
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m agenttest propose-change
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m agenttest review-change
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m agenttest diagnose-change
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m agenttest review-change

      - name: Measure experiment design health
        if: steps.heartbeat_claim.outputs.status != 'already_completed'
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src \
            python scripts/experiment_design_eval.py \
              --state state/organism.json \
              --output state/experiment_design_diagnostic.json

      - name: Measure blocked attention health
        if: steps.heartbeat_claim.outputs.status != 'already_completed'
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src \
            python scripts/blocked_attention_eval.py \
              --state state/organism.json \
              --output state/blocked_attention_diagnostic.json

      - name: Verify Phase 42 live-state integrity
        if: steps.heartbeat_claim.outputs.status != 'already_completed'
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python scripts/phase42_integrity_eval.py --state state/organism.json

      - name: Measure Phase 42 resumption opportunities
        if: steps.heartbeat_claim.outputs.status != 'already_completed'
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src \
            python scripts/phase42_resumption_opportunity_eval.py \
              --state state/organism.json \
              --output state/phase42_resumption_opportunities.json

      - name: Verify behavioral preservation
        if: steps.heartbeat_claim.outputs.status != 'already_completed'
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python scripts/preservation_eval.py --strict --output /tmp/growth-preservation.json

      - name: Enforce journal branch scope
        if: steps.heartbeat_claim.outputs.status != 'already_completed'
        shell: bash
        run: |
          unexpected="$(
            {
              git diff --name-only origin/main...HEAD
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u | grep -Ev '^state/' || true
          )"
          if [ -n "$unexpected" ]; then
            echo "Autonomous growth journal attempted to modify non-state paths:"
            echo "$unexpected"
            exit 1
          fi

      - name: Verify bounded heartbeat commit coherence
        if: env.CURRENT_WORLD_INVESTIGATION == 'true' && steps.heartbeat_claim.outputs.status != 'already_completed'
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -B scripts/heartbeat_request_claim.py verify --request-id "$HEARTBEAT_REQUEST_ID"

      - name: Preserve the computed cycle by exact commit identity
        if: steps.heartbeat_claim.outputs.status != 'already_completed'
        shell: bash
        run: |
          python -I -B "$GROWTH_SOURCE_GUARD" verify-source --source-sha "$VERIFIED_SOURCE_SHA"
          python -I -B "$GROWTH_TRANSPORT" complete --root "$GITHUB_WORKSPACE" --request-id "$HEARTBEAT_REQUEST_ID" --source-sha "$VERIFIED_SOURCE_SHA" --claim-commit "$HEARTBEAT_CLAIM_COMMIT"
          git add state/
          git commit -m "Record autonomous growth cycle" -m "Heartbeat-Request: $HEARTBEAT_REQUEST_ID"
          python -I -B "$GROWTH_SOURCE_GUARD" verify-source --source-sha "$VERIFIED_SOURCE_SHA"
          python -I -B "$GROWTH_TRANSPORT" publish --root "$GITHUB_WORKSPACE" --candidate "$(git rev-parse HEAD)" --expected-parent "$HEARTBEAT_CLAIM_COMMIT"

      - name: Open inspection PR if needed
        if: steps.heartbeat_claim.outputs.status != 'already_completed'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          EXISTING="$(gh pr list --head autonomous/growth --base main --state open --json number --jq '.[0].number')"
          if [ -z "$EXISTING" ]; then
            gh pr create --draft --head autonomous/growth --base main --title "Autonomous growth journal" --body "Persistent AgentTest cycles generated by the growth loop. This branch records state and proposals without automatically merging them into the verified baseline." || echo "PR creation was unavailable; the growth branch remains preserved."
          else
            echo "Growth PR #$EXISTING already open."
          fi

