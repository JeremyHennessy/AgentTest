name: autonomous-heartbeat-controller
run-name: heartbeat controller ${{ inputs.request_id || 'bootstrap' }}

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/heartbeat-controller.yml"
      - "scripts/heartbeat_controller.py"
  workflow_dispatch:
    inputs:
      controller_token:
        description: "Controller generation token"
        required: true
      request_id:
        description: "Deterministic ticket from the growth branch terminal receipt"
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  # Retain the previous lane while old controller deliveries drain.
  group: agenttest-heartbeat-controller-v2
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate controller generation
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONTROLLER_TOKEN: ${{ inputs.controller_token || '' }}
          REQUEST_ID: ${{ inputs.request_id || '' }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$CONTROLLER_TOKEN" = "controller-v4"
            test -n "$REQUEST_ID"
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Wait for reconciliation lane and manage one durable ticket
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id || '' }}
        run: >-
          python -B scripts/heartbeat_controller.py controller
          --request-id "$REQUEST_ID" --run-id "$GITHUB_RUN_ID"
