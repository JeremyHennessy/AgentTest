name: human-interaction

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Message to AgentTest"
        required: true
        type: string
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  push:
    branches:
      - main
    paths:
      - ".github/workflows/interact.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agenttest-autonomous-growth
  cancel-in-progress: false

jobs:
  interact:
    if: >-
      (github.event_name != 'issue_comment' && github.event_name != 'issues') ||
      (github.actor == github.repository_owner &&
       ((github.event_name == 'issue_comment' &&
         startsWith(github.event.comment.body, '/agent ')) ||
        (github.event_name == 'issues' &&
         startsWith(github.event.issue.body, '/agent '))))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare persistent growth branch
        shell: bash
        run: |
          git config user.name "agenttest-interaction"
          git config user.email "agenttest-interaction@users.noreply.github.com"
          git fetch origin autonomous/growth:refs/remotes/origin/autonomous/growth || true
          if git show-ref --verify --quiet refs/remotes/origin/autonomous/growth; then
            git checkout -B autonomous/growth origin/autonomous/growth
            git merge --no-edit origin/main
          else
            git checkout -b autonomous/growth origin/main
          fi

      - name: Resolve authorized message
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MESSAGE: ${{ inputs.message }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ISSUE_ID: ${{ github.event.issue.id }}
          RUN_ID: ${{ github.run_id }}
          PUSH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event = os.environ.get("EVENT_NAME", "")
          skip = False
          reuse = False

          if event == "workflow_dispatch":
              message = os.environ.get("DISPATCH_MESSAGE", "").strip()
              request_id = "workflow:" + os.environ["RUN_ID"]
          elif event == "issue_comment":
              body = os.environ.get("COMMENT_BODY", "")
              message = body[len("/agent "):].strip() if body.startswith("/agent ") else ""
              request_id = "issue-comment:" + os.environ["COMMENT_ID"]
          elif event == "issues":
              body = os.environ.get("ISSUE_BODY", "")
              message = body[len("/agent "):].strip() if body.startswith("/agent ") else ""
              request_id = "issue:" + os.environ["ISSUE_ID"]
          else:
              request_id = "push:" + os.environ["PUSH_SHA"]
              state_path = Path("state/organism.json")
              has_interaction = False
              if state_path.exists():
                  try:
                      state = json.loads(state_path.read_text(encoding="utf-8"))
                      has_interaction = bool(state.get("interactions"))
                  except Exception:
                      has_interaction = False
              if has_interaction:
                  skip = True
                  message = ""
              else:
                  message = (
                      "Jeremy: Continue doing whatever you think is best to evolve. "
                      "Let me know if you need anything."
                  )

          if not skip and not message:
              raise SystemExit("No authorized interaction message was supplied.")

          response_source = "state/last_interaction.json"
          if not skip:
              state_path = Path("state/organism.json")
              last_path = Path("state/last_interaction.json")
              state = None
              if state_path.exists():
                  state = json.loads(state_path.read_text(encoding="utf-8"))
                  matches = [
                      row for row in state.get("interactions", [])
                      if row.get("request_id") == request_id
                  ]
                  if len(matches) > 1:
                      raise SystemExit("Ambiguous persisted interaction request identity.")
                  if matches:
                      reuse = True
                      record = matches[0]
                      question = next(
                          (row for row in state.get("questions", [])
                           if row.get("id") == record.get("question_id")),
                          None,
                      )
                      experiment = next(
                          (row for row in state.get("experiments", [])
                           if row.get("id") == record.get("experiment_id")),
                          None,
                      )
                      reconstructed = {
                          "interaction": record,
                          "response_text": record.get("response_text"),
                          "current": {
                              "question": question,
                              "experiment": experiment,
                          },
                      }
                      response_source = "/tmp/agenttest-reused-interaction.json"
                      Path(response_source).write_text(
                          json.dumps(reconstructed, indent=2, sort_keys=True) + "\n",
                          encoding="utf-8",
                      )

              if last_path.exists():
                  last = json.loads(last_path.read_text(encoding="utf-8"))
                  last_id = (last.get("interaction") or {}).get("request_id")
                  if last_id == request_id and not reuse:
                      raise SystemExit(
                          "Latest interaction sidecar claims request identity absent from organism state."
                      )
                  if last_id == request_id:
                      response_source = str(last_path)

          Path("/tmp/agenttest-message.txt").write_text(message, encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"SKIP_INTERACTION={'true' if skip else 'false'}\n")
              handle.write(f"REUSE_INTERACTION={'true' if reuse else 'false'}\n")
              handle.write(f"INTERACTION_REQUEST_ID={request_id}\n")
              handle.write(f"INTERACTION_RESPONSE_SOURCE={response_source}\n")
          PY

      - name: Claim interaction request remotely
        if: env.SKIP_INTERACTION != 'true' && env.REUSE_INTERACTION != 'true'
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src \
            python scripts/interaction_request_claim.py \
              --sidecar state/last_interaction.json \
              --request-id "$INTERACTION_REQUEST_ID" \
              --message-file /tmp/agenttest-message.txt \
              --event-name "$GITHUB_EVENT_NAME"
          if [ -e state/last_interaction.json ]; then
            git add state/last_interaction.json
          fi
          if git diff --cached --quiet; then
            echo "Interaction request claim already exists or no prior sidecar is available."
          else
            git commit -m "Claim human interaction request"
            git push origin autonomous/growth
          fi

      - name: Run evidence-linked interaction
        if: env.SKIP_INTERACTION != 'true' && env.REUSE_INTERACTION != 'true'
        shell: bash
        run: |
          mkdir -p state
          MESSAGE="$(cat /tmp/agenttest-message.txt)"
          OUTPUT=/tmp/agenttest-last-interaction.json
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src \
            python -m agenttest interact --self-observe --request-id "$INTERACTION_REQUEST_ID" "$MESSAGE" \
            > "$OUTPUT"
          cat "$OUTPUT"
          cp "$OUTPUT" state/last_interaction.json

      - name: Verify invariant and preservation suites
        if: env.SKIP_INTERACTION != 'true' && env.REUSE_INTERACTION != 'true'
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src             python -m unittest discover -s tests -v
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src             python scripts/preservation_eval.py --strict --output /tmp/interaction-preservation.json

      - name: Persist interaction
        if: env.SKIP_INTERACTION != 'true' && env.REUSE_INTERACTION != 'true'
        shell: bash
        run: |
          git add state/
          if git diff --cached --quiet; then
            echo "No interaction state change to preserve."
            exit 0
          fi
          git commit -m "Record human interaction"
          git push origin autonomous/growth

      - name: Render response for GitHub comment
        if: env.SKIP_INTERACTION != 'true' && (github.event_name == 'issue_comment' || github.event_name == 'issues')
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["INTERACTION_RESPONSE_SOURCE"])
          data = json.loads(source.read_text(encoding="utf-8"))
          record = data["interaction"]
          current = data["current"]
          question = (current.get("question") or {}).get("text", "none")
          experiment = (current.get("experiment") or {}).get("method", "none")
          body = (
              f"**AgentTest {record['id']} · cycle {record['cycle']}**\n\n"
              f"{data['response_text']}\n\n"
              f"**Current question:** {question}\n\n"
              f"**Proposed test:** {experiment}\n\n"
              "_This is an evidence-linked state rendering, not a claim of consciousness._\n\n"
              f"<!-- agenttest-request:{record.get('request_id', '')} -->\n"
          )
          Path("/tmp/agenttest-reply.md").write_text(body, encoding="utf-8")
          PY

      - name: Reply to owner comment
        if: env.SKIP_INTERACTION != 'true' && (github.event_name == 'issue_comment' || github.event_name == 'issues')
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          MARKER="<!-- agenttest-request:$INTERACTION_REQUEST_ID -->"
          if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --jq '.[].body' | grep -Fq -- "$MARKER"; then
            echo "Reply already exists for $INTERACTION_REQUEST_ID."
          else
            gh issue comment "$ISSUE_NUMBER" --body-file /tmp/agenttest-reply.md
          fi

      - name: Close one-shot interaction issue
        if: env.SKIP_INTERACTION != 'true' && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          STATE="$(gh issue view "$ISSUE_NUMBER" --json state --jq .state)"
          if [ "$STATE" = "OPEN" ]; then
            gh issue close "$ISSUE_NUMBER" --reason completed
          else
            echo "Interaction issue is already closed."
          fi
