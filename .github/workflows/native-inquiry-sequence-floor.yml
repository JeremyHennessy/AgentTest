name: native-inquiry-sequence-floor

on:
  push:
    branches:
      - fix/native-inquiry-sequence-floor
    paths:
      - src/agenttest/core.py
      - tests/test_native_inquiry_resolution.py
      - scripts/native_inquiry_sequence_floor_study.py
      - docs/native-inquiry-sequence-floor.md
      - .github/workflows/native-inquiry-sequence-floor.yml

permissions:
  contents: read

env:
  PRODUCTION_BASE: 404ea4be0127d14fe419e635b239c2e51e9c4532
  PINNED_STATE_SHA: e39688f1037b9e83db3ad37f3b94e22e937782cb

jobs:
  copied-state-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: 404ea4be0127d14fe419e635b239c2e51e9c4532
          path: baseline
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: e39688f1037b9e83db3ad37f3b94e22e937782cb
          path: source
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: state/organism.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact head and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$PRODUCTION_BASE"
          test "$(git -C source rev-parse HEAD)" = "$PINNED_STATE_SHA"
          python - <<'PY'
          import os
          import subprocess

          allowed = {
              "src/agenttest/core.py",
              "tests/test_native_inquiry_resolution.py",
              "scripts/native_inquiry_sequence_floor_study.py",
              "docs/native-inquiry-sequence-floor.md",
              ".github/workflows/native-inquiry-sequence-floor.yml",
          }
          changed = set(
              subprocess.check_output(
                  [
                      "git",
                      "-C",
                      "candidate",
                      "diff",
                      "--name-only",
                      f"{os.environ['PRODUCTION_BASE']}...HEAD",
                  ],
                  text=True,
              ).splitlines()
          )
          if changed != allowed:
              raise SystemExit(
                  "unexpected candidate scope: "
                  + ", ".join(sorted(changed ^ allowed))
              )
          PY

      - name: Run focused native inquiry resolution tests
        working-directory: candidate
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest tests.test_native_inquiry_resolution -v

      - name: Run copied archival-shift contrast
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          mkdir -p artifacts
          sha256sum source/state/organism.json > artifacts/source-state.sha256
          python candidate/scripts/native_inquiry_sequence_floor_study.py             --state source/state/organism.json             --baseline-src baseline/src             --candidate-src candidate/src             --remove-prefix 1000             --output artifacts/sequence-floor-study.json             2>&1 | tee artifacts/sequence-floor-study.log

      - name: Verify pinned source remains read-only
        shell: bash
        run: |
          sha256sum -c artifacts/source-state.sha256

      - name: Package reviewed source and evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          git -C candidate rev-parse HEAD > artifacts/candidate-sha.txt
          git -C candidate diff --stat "$PRODUCTION_BASE"...HEAD             > artifacts/candidate-diff-stat.txt
          git -C candidate archive --format=tar.gz HEAD             src/agenttest/core.py             tests/test_native_inquiry_resolution.py             scripts/native_inquiry_sequence_floor_study.py             docs/native-inquiry-sequence-floor.md             .github/workflows/native-inquiry-sequence-floor.yml             > artifacts/reviewed-source.tar.gz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-inquiry-sequence-floor-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
