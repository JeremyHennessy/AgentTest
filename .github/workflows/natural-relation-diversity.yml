name: natural-relation-diversity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/natural_relation_diversity_sweep.py"
      - "tests/test_natural_relation_diversity_sweep.py"
      - ".github/workflows/natural-relation-diversity.yml"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate deterministic frozen-rule sweep
        env:
          PYTHONPATH: src:experiments
        run: |
          mkdir -p artifacts
          python scripts/natural_relation_diversity_sweep.py > artifacts/natural_relation_diversity_sweep.json
          python scripts/natural_relation_diversity_sweep.py > "$RUNNER_TEMP/sweep-second.json"
          cmp artifacts/natural_relation_diversity_sweep.json "$RUNNER_TEMP/sweep-second.json"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/natural_relation_diversity_sweep.json").read_text())
          print(json.dumps({
              "trajectory_count": report["trajectory_count"],
              "winner_counts": report["winner_counts"],
              "distinct_winners": report["distinct_winners"],
              "crossed_selection_boundary": report["crossed_selection_boundary"],
          }, sort_keys=True))
          PY
      - name: Retain complete sweep
        uses: actions/upload-artifact@v4
        with:
          name: natural-relation-diversity-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/natural_relation_diversity_sweep.json
          if-no-files-found: error
          retention-days: 30
