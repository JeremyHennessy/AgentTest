name: Observer presentation checks
on:
  pull_request:
    paths:
      - observer.html
      - observer.css
      - observer.js
      - tests/observer_browser_check.py
      - tests/test_observer_overview.py
      - .github/workflows/observer-preview.yml
      - .github/workflows/pages.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated presentation-test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise the served Observer against read-only fixtures
        env:
          OBSERVER_EVIDENCE: ${{ runner.temp }}/observer-evidence
        run: |
          python -m unittest discover -s tests -p test_observer_overview.py -v
          python tests/observer_browser_check.py
      - name: Preserve screenshots and browser receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observer-preview-${{ github.sha }}
          path: ${{ runner.temp }}/observer-evidence/
          if-no-files-found: error
          retention-days: 30
