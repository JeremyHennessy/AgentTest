name: open-object-world-epistemic-actions

on:
  pull_request:
    paths:
      - "experiments/open_object_world*.py"
      - "scripts/open_object_world_epistemic_action_study.py"
      - "tests/test_open_object_world_epistemic_actions.py"
      - ".github/workflows/open-object-world-epistemic-actions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run epistemic action policy tests
        env:
          PYTHONPATH: src:experiments
        run: python -m unittest tests.test_open_object_world_epistemic_actions -v
      - name: Run counterfactual epistemic-action study
        env:
          PYTHONPATH: src:experiments
        run: |
          mkdir -p artifacts
          python scripts/open_object_world_epistemic_action_study.py > artifacts/open-object-world-epistemic-actions.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/open-object-world-epistemic-actions.json").read_text())
          print(json.dumps(report["summary"], sort_keys=True))
          for row in report["rows"]:
              print(json.dumps(row, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: open-object-world-epistemic-actions-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/open-object-world-epistemic-actions.json
          if-no-files-found: error
          retention-days: 30
