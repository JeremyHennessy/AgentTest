name: open-object-world

on:
  pull_request:
    paths:
      - "experiments/open_object_world.py"
      - "experiments/open_object_world_explorer.py"
      - "scripts/open_object_world_study.py"
      - "tests/test_open_object_world*.py"
      - ".github/workflows/open-object-world.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run object-world tests
        env:
          PYTHONPATH: src:experiments
        run: |
          python -m unittest tests.test_open_object_world -v
          python -m unittest tests.test_open_object_world_explorer -v
      - name: Generate deterministic unguided study
        env:
          PYTHONPATH: src:experiments
        run: |
          mkdir -p artifacts
          python scripts/open_object_world_study.py > artifacts/open-object-world-study.json
          python scripts/open_object_world_study.py > "$RUNNER_TEMP/second.json"
          cmp artifacts/open-object-world-study.json "$RUNNER_TEMP/second.json"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/open-object-world-study.json").read_text())
          print(json.dumps(report["summary"], sort_keys=True))
          for row in report["rows"]:
              print(json.dumps({
                  "seed": row["seed"],
                  "unique_observation_count": row["unique_observation_count"],
                  "unique_position_count": row["unique_position_count"],
                  "unique_inventory_state_count": row["unique_inventory_state_count"],
                  "observed_effect_counts": row["observed_effect_counts"],
                  "entities_with_multiple_observed_states": row["entities_with_multiple_observed_states"],
                  "final_observation": row["final_observation"],
              }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: open-object-world-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/open-object-world-study.json
          if-no-files-found: error
          retention-days: 30
