name: ora2-adaptive-model-selection-study-001

# One branch-scoped saved-evidence execution only. Never schedules a pilot.
on:
  push:
    branches:
      - ora2/adaptive-model-choice-20261008
    paths:
      - '.github/workflows/ora2-adaptive-model-study001.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ora2-adaptive-model-study001
  cancel-in-progress: false

jobs:
  prequential:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
      PYTHONDONTWRITEBYTECODE: '1'
      AGENTTEST_MODEL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Validate exact protocol, branch and protected source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ora2/adaptive-model-choice-20261008'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:src)" = '9b0f880af84a0b1b69fd6aa9009ab738acd7dfad'
          test "$(git rev-parse HEAD:docs/ORA2_ADAPTIVE_MODEL_STUDY001.md)" = 'e0ffd531efbe118cc290aa175f8e5e3dc5be726a'
          git diff --exit-code HEAD -- state/ src/
      - name: Run synthetic forecast-order and provenance tests
        run: python -B -m unittest discover -s tests -p 'test_ora2_adaptive_model_choice.py' -v
      - name: Retrieve SHA-locked planner-only study artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11521061953/zip" > "$RUNNER_TEMP/frozen-planner-artifact.zip"
          echo "859df0d4b24abf4b856b1c66eb19782361e980dc749b5a3fc5878e9dd65ab3b4  $RUNNER_TEMP/frozen-planner-artifact.zip" | sha256sum -c -
          mkdir "$RUNNER_TEMP/cycle1803"
      - name: Read-only cycle-1803 reconstruction (no original action)
        run: |
          python -B -m ora2.reconstruct_inherited_checkpoint \
            --artifact "$RUNNER_TEMP/frozen-planner-artifact.zip" \
            --output-directory "$RUNNER_TEMP/cycle1803"
      - name: Execute registered 1,381 warmup and 256 prequential test cases once
        shell: bash
        run: |
          set -euo pipefail
          python -B -m ora2.adaptive_model_choice \
            --snapshot "$RUNNER_TEMP/cycle1803/study002_snapshot.json" \
            --journal "$RUNNER_TEMP/cycle1803/study002_journal.jsonl" \
            --output "$RUNNER_TEMP/ora2-adaptive-model-study001.json"
          echo "f37c788cee851622823a848a7e3b8b32f67c06bec4b94eb5b709922e7a7aa6ec  $RUNNER_TEMP/cycle1803/study002_snapshot.json" | sha256sum -c -
          echo "717b7380101ff7656b13cc5d9f8ac14ade862a6bdd1b9363ad3029d29d8e35e9  $RUNNER_TEMP/cycle1803/study002_journal.jsonl" | sha256sum -c -
          git diff --exit-code HEAD -- state/ src/
          python - <<'PY'
          import hashlib,json,math,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'ora2-adaptive-model-study001.json'
          result=json.loads(p.read_text())
          cases=result['cases']
          assert result['status']=='VALID_RECORDED_PREQUENTIAL_RESULT'
          assert result['evidence_records']==1637 and result['warmup_records']==1381
          assert result['evaluation_records']==256 and len(cases)==256
          assert result['cold_replay_identical'] is True
          assert result['original_live_ora_actions']==result['copied_world_actions']==0
          assert result['persistent_pilot_enabled'] is False
          assert result['result_kind'] in ('NARROW_RETROSPECTIVE_SCREEN_MET', 'VALID_NEGATIVE_ADAPTIVE_MODEL_COMPARISON')
          assert result['screen_met']==(result['result_kind']=='NARROW_RETROSPECTIVE_SCREEN_MET')
          names=('adaptive','shared_effect','exact_context','local_exception')
          for i,c in enumerate(cases):
              assert c['sequence']==1382+i
              if i: assert c['prior_chain_sha256']==cases[i-1]['chain_sha256']
              before=c.copy(); before.pop('chain_sha256')
              seal=hashlib.sha256((c['prior_chain_sha256']+'\n'+json.dumps(before,sort_keys=True,separators=(',',':'),allow_nan=False)).encode()).hexdigest()
              assert seal==c['chain_sha256']
              for model in names:
                  probs=c['distributions'][model]
                  assert len(probs)==25 and math.isclose(math.fsum(x['p'] for x in probs),1.,rel_tol=0,abs_tol=1e-12)
                  target=next(x['p'] for x in probs if x['after']==c['after'])
                  assert math.isclose(-math.log2(target),c['scores'][model]['loss_bits'],abs_tol=1e-12)
          assert cases[-1]['chain_sha256']==result['final_provenance_chain_sha256']
          for model in names:
              actual=math.fsum(c['scores'][model]['loss_bits'] for c in cases)/256
              assert math.isclose(actual,result['mean_log_loss_bits'][model],rel_tol=0,abs_tol=1e-12)
          print('Registered result report SHA256:', hashlib.sha256(p.read_bytes()).hexdigest())
          print('Result:', result['result_kind'])
          print('Mean advantage:', result['advantage_vs_best_fixed_bits_per_case'])
          print('Block wins:', result['block_wins'])
          PY
      - name: Archive entire original saved-evidence result including valid negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ora2-adaptive-model-study001-${{ github.run_id }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/ora2-adaptive-model-study001.json
          retention-days: 90
