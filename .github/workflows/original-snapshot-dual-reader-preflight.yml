name: original-snapshot-dual-reader-real-copy-preflight

# Never scheduled. Runs on a detached copy of the original growth commit.
on:
  push:
    branches:
      - fix/original-snapshot-writer-preview-20261020
    paths:
      - 'src/agenttest/snapshot_storage.py'
      - 'tests/test_snapshot_storage.py'
      - '.github/workflows/original-snapshot-dual-reader-preflight.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Verify codec synthetic contracts
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -B -m unittest discover -s tests -p test_snapshot_storage.py -v
      - name: Pin authentic original snapshot read-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --filter=blob:none origin refs/heads/autonomous/growth:refs/remotes/origin/autonomous/growth
          git worktree add --detach "$RUNNER_TEMP/original-growth" refs/remotes/origin/autonomous/growth
          test -z "$(git -C "$RUNNER_TEMP/original-growth" status --porcelain)"
      - name: Reconstruct byte-exact authentic snapshot from candidate envelope
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          from agenttest.snapshot_storage import prepare_compressed_copy, read_snapshot_bytes
          growth=pathlib.Path(os.environ["RUNNER_TEMP"])/"original-growth"
          original=growth/"state/organism.json"
          raw=read_snapshot_bytes(original)
          expected=subprocess.check_output(["git","-C",str(growth),"rev-parse","HEAD:state/organism.json"],text=True).strip()
          git_blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          if git_blob!=expected:
              raise SystemExit("authentic Git blob mismatch")
          envelope,name,packed=prepare_compressed_copy(raw)
          isolated=pathlib.Path(os.environ["RUNNER_TEMP"])/"compressed-copy"
          isolated.mkdir()
          (isolated/"organism.json").write_bytes(envelope)
          (isolated/name).write_bytes(packed)
          if read_snapshot_bytes(isolated/"organism.json")!=raw:
              raise SystemExit("byte-exact roundtrip mismatch")
          from agenttest.state import StateStore
          if StateStore(isolated/"organism.json").load()!=StateStore(original).load():
              raise SystemExit("StateStore migrated object differs")
          if read_snapshot_bytes(original)!=raw:
              raise SystemExit("original changed during preflight")
          if subprocess.check_output(["git","-C",str(growth),"status","--porcelain"]).strip():
              raise SystemExit("original worktree was modified")
          print(json.dumps({"status":"READ_ONLY_EXACT_ROUNDTRIP","growth_head":subprocess.check_output(["git","-C",str(growth),"rev-parse","HEAD"],text=True).strip(),"candidate_head":os.environ["GITHUB_SHA"],"original_bytes":len(raw),"compressed_bytes":len(packed),"raw_sha256":hashlib.sha256(raw).hexdigest(),"original_actions":0,"history_writes":0,"production_cutover":False},sort_keys=True))
          PY

      - name: Verify real original copy saves losslessly via stable packed writer
        shell: bash
        env:
          PYTHONPATH: src
          ORA_ORIGINAL_SNAPSHOT_GZIP: "1"
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          from agenttest.state import StateStore
          from agenttest.snapshot_storage import read_snapshot_bytes
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          original=root/"original-growth"/"state"/"organism.json"
          isolated=root/"writer-preview"
          isolated.mkdir()
          target=isolated/"organism.json"
          shutil.copyfile(original,target)
          before=hashlib.sha256(original.read_bytes()).hexdigest()
          store=StateStore(target)
          current=store.load()
          current_cycle=current["cycles"]
          store.save(current)
          current.pop("updated_at",None)
          manifest=json.loads(target.read_bytes())
          if manifest.get("format")!="ora-original-gzip-v1": raise SystemExit("writer did not produce envelope")
          after=store.load()
          if after.pop("updated_at",None) is None: raise SystemExit("updated_at missing")
          if current!=after: raise SystemExit("real original copy changed semantic data")
          if after["cycles"]!=current_cycle: raise SystemExit("writer changed cycle")
          if hashlib.sha256(original.read_bytes()).hexdigest()!=before: raise SystemExit("source was modified")
          if subprocess.check_output(["git","-C",str(root/"original-growth"),"status","--porcelain"]).strip(): raise SystemExit("growth worktree modified")
          restored=read_snapshot_bytes(target)
          print(json.dumps({"scope":"real_original_copy","source_cycle":current_cycle,"unchanged_source_sha256":before,"restored_sha256":hashlib.sha256(restored).hexdigest(),"packed_file":manifest["gzip_file"],"packed_bytes":manifest["gzip_bytes"],"original_writes":0,"live_cutover":False},sort_keys=True))
          PY
