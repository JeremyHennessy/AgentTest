name: Deploy AgentTest observer

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - .github/workflows/pages.yml
  workflow_run:
    workflows:
      - autonomous-growth-cycle
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout observer source
        uses: actions/checkout@v6
        with:
          ref: main
          path: observer

      - name: Checkout latest persistent organism state
        uses: actions/checkout@v6
        with:
          ref: autonomous/growth
          path: growth
          sparse-checkout: |
            state/organism.json
            state/last_interaction.json
          sparse-checkout-cone-mode: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static observer artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/state
          cp observer/index.html _site/index.html
          cp growth/state/organism.json _site/state/organism.json
          cp growth/state/last_interaction.json _site/state/last_interaction.json
          growth_sha="$(git -C growth rev-parse HEAD)"
          generation="$(jq -r '.generation' growth/state/organism.json)"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"growth_sha":"%s","generation":%s,"published_at":"%s"}\n' "$growth_sha" "$generation" "$published_at" > _site/state/meta.json
          echo "Publishing growth state $growth_sha at generation $generation"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
