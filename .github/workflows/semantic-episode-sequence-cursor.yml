name: semantic-episode-sequence-cursor

on:
  push:
    branches: [fix/semantic-episode-sequence-cursor]

permissions:
  contents: read

env:
  PRODUCTION_BASE: d1a4046b0941788ddf642cf64a279380f08ed1a6
  PINNED_STATE_SHA: 6581c367384f88fdbec2e04ae8b83328c72d1096

jobs:
  verify-cursor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCTION_BASE }}
          path: baseline
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PINNED_STATE_SHA }}
          path: source
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: state/organism.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact head and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import subprocess
          allowed = {
              "src/agenttest/episode_identity.py",
              "src/agenttest/state.py",
              "src/agenttest/semantic.py",
              "tests/test_semantic_episode_sequence_cursor.py",
              "scripts/semantic_episode_sequence_cursor_study.py",
              "docs/semantic-episode-sequence-cursor.md",
              ".github/workflows/semantic-episode-sequence-cursor.yml",
          }
          def tree(folder):
              rows=subprocess.check_output(
                  ["git","-C",folder,"ls-tree","-r","HEAD"],
                  text=True,
              ).splitlines()
              result = {}
              for row in rows:
                  tab = chr(9)
                  if tab not in row:
                      continue
                  meta, path = row.split(tab, 1)
                  parts = meta.split()
                  if len(parts) < 3:
                      continue
                  result[path] = parts[2]
              return result
          before, after = tree("baseline"), tree("candidate")
          changed={
              path
              for path in set(before) | set(after)
              if before.get(path) != after.get(path)
          }
          if changed != allowed:
              raise SystemExit("unexpected candidate scope: " + repr(changed ^ allowed))
          PY

      - name: Run focused cursor tests
        working-directory: candidate
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest tests.test_semantic_episode_sequence_cursor -v

      - name: Compare normal copied heartbeats and deletion recovery
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          mkdir -p artifacts
          python candidate/scripts/semantic_episode_sequence_cursor_study.py             --state source/state/organism.json             --baseline-src baseline/src             --candidate-src candidate/src             --source-sha "$PINNED_STATE_SHA"             --steps 5             --output artifacts/semantic-cursor-study.json             2>&1 | tee artifacts/study.log

      - name: Package reviewed source and evidence only
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          git -C candidate rev-parse HEAD > artifacts/candidate-sha.txt
          git -C candidate archive --format=tar.gz HEAD src scripts tests docs .github > artifacts/reviewed-source.tar.gz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-episode-sequence-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
