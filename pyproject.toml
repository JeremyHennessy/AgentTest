[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttest"
version = "0.1.0"
description = "An original experiment in persistent, evidence-driven machine growth."
requires-python = ">=3.11"
authors = [{name = "AgentTest"}]

[project.scripts]
agenttest = "agenttest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
